{% load i18n %}
<script>
    $("#reloadMessagesButton").click()
</script>
<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title">{% trans "Password Reset" %}</span>
    <button
        class="oh-modal__close--custom"
        onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
        aria-label="{% trans 'Close' %}"
    >
        <ion-icon name="close-outline" role="img" class="md hydrated" aria-label="{% trans 'close outline' %}"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    {% if results %}
        <p class="text-sm text-[#666] mb-3">
            {% trans "Copy these now — they will not be shown again." %}
        </p>
        <div class="space-y-2">
            {% for item in results %}
                <div class="flex items-center gap-2 border border-[#e6e6e6] rounded-md p-2">
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium truncate">{{ item.employee }}</div>
                        <input
                            type="text"
                            readonly
                            value="{{ item.password }}"
                            class="oh-input w-full mt-1 font-mono text-sm"
                            onclick="this.select();"
                        >
                    </div>
                    <button
                        type="button"
                        class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                        title="{% trans 'Copy' %}"
                        onclick="navigator.clipboard.writeText('{{ item.password|escapejs }}'); var icon=this.querySelector('ion-icon'); icon.setAttribute('name','checkmark-outline');"
                    >
                        <ion-icon name="copy-outline"></ion-icon>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-sm text-[#666]">{% trans "No accounts were updated." %}</p>
    {% endif %}
</div>
<div class="oh-modal__dialog-footer"></div>
