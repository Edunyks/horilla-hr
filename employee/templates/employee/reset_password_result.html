{% load i18n %}
<script>
    $("#reloadMessagesButton").click()
</script>
<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title">{% trans "Password Reset" %}</span>
    <button
        class="oh-modal__close--custom"
        onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
        aria-label="{% trans 'Close' %}"
    >
        <ion-icon name="close-outline" role="img" class="md hydrated" aria-label="{% trans 'close outline' %}"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    {% if results %}
        <div class="flex items-center justify-between gap-2 mb-3">
            <p class="text-sm text-[#666]">
                {% trans "Copy these now — they will not be shown again." %}
            </p>
            <button
                type="button"
                id="passwordResetCsvBtn"
                class="oh-btn oh-btn--light-bkg text-xs flex items-center gap-1 shrink-0"
                title="{% trans 'Download as CSV' %}"
            >
                <ion-icon name="download-outline"></ion-icon>
                {% trans "Download CSV" %}
            </button>
        </div>
        <div class="space-y-2" id="passwordResetRows">
            {% for item in results %}
                <div
                    class="flex items-center gap-2 border border-[#e6e6e6] rounded-md p-2"
                    data-name="{{ item.employee }}"
                    data-email="{{ item.employee.email|default:'' }}"
                    data-password="{{ item.password }}"
                >
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium truncate">{{ item.employee }}</div>
                        <input
                            type="text"
                            readonly
                            value="{{ item.password }}"
                            class="oh-input w-full mt-1 font-mono text-sm"
                            onclick="this.select();"
                        >
                    </div>
                    <button
                        type="button"
                        class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                        title="{% trans 'Copy' %}"
                        onclick="navigator.clipboard.writeText('{{ item.password|escapejs }}'); var icon=this.querySelector('ion-icon'); icon.setAttribute('name','checkmark-outline');"
                    >
                        <ion-icon name="copy-outline"></ion-icon>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-sm text-[#666]">{% trans "No accounts were updated." %}</p>
    {% endif %}
</div>
<div class="oh-modal__dialog-footer"></div>
<script>
    (function () {
        var btn = document.getElementById("passwordResetCsvBtn");
        if (!btn) return;
        // Built entirely client-side from the rows already rendered in this
        // modal -- the plaintext passwords only ever exist in this one-time
        // response, never stored server-side, so exporting has to read them
        // back out of the DOM rather than making a second request for them.
        btn.addEventListener("click", function () {
            var rows = document.querySelectorAll("#passwordResetRows > div");
            var csvEscape = function (value) {
                value = value == null ? "" : String(value);
                if (/[",\n]/.test(value)) {
                    value = '"' + value.replace(/"/g, '""') + '"';
                }
                return value;
            };
            var lines = [["Employee", "Email", "Password"].map(csvEscape).join(",")];
            rows.forEach(function (row) {
                lines.push([
                    row.getAttribute("data-name"),
                    row.getAttribute("data-email"),
                    row.getAttribute("data-password"),
                ].map(csvEscape).join(","));
            });
            var blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = "password-reset-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    })();
</script>
