services:
  # Containerized Postgres is acceptable for disposable staging data. Move
  # Postgres to managed/dedicated infrastructure before real employee or payroll
  # history is stored here.
  postgres:
    profiles: ["embedded-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - candour-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django cache (REDIS_URL). Not optional like postgres: the app, the
  # readiness probe and the scheduler all expect it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Exec form so a password with spaces or quotes stays one argument.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      # redis-cli reads this, so the healthcheck needs no escaped variable:
      # Coolify does not reliably preserve Compose $$ escapes.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - candour-staging-redis:/data
    healthcheck:
      # Plain `redis-cli ping` exits 0 on a NOAUTH error, so check for PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot release step: docker/entrypoint.sh runs `migrate` and
  # `collectstatic --clear`, then execs the command (`true`) and exits 0.
  # web and scheduler skip release tasks and wait for this to succeed, so a
  # failed migration leaves the app stopped instead of serving against an
  # incompatible schema, and the two long-running containers never race DDL.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: "no"
    command: ["true"]
    environment: &app-env
      DEBUG: "0"
      CANDOUR_ENV: ${CANDOUR_ENV:-staging}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?set DB_INIT_PASSWORD}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      # Coolify's proxy (Traefik) terminates TLS and is the single proxy hop.
      AXES_PROXY_COUNT: ${AXES_PROXY_COUNT:-1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    volumes:
      - candour-staging-staticfiles:/app/staticfiles
      - candour-staging-media:/app/media
    labels:
      com.candour.service: migration-runner
    # The image HEALTHCHECK curls :8000, which this container never serves.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      CANDOUR_SKIP_RELEASE_TASKS: "1"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes:
      - candour-staging-staticfiles:/app/staticfiles
      - candour-staging-media:/app/media
    labels:
      com.candour.service: web
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Background jobs. Keep exactly one replica: the jobs are not idempotent, so
  # a second copy means a second payslip run and a second backup.
  scheduler:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    environment:
      <<: *app-env
      CANDOUR_SKIP_RELEASE_TASKS: "1"
    volumes:
      - candour-staging-media:/app/media
    labels:
      com.candour.service: scheduler
    # Binds no port, so the image's :8000 HEALTHCHECK can never pass.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  candour-staging-postgres:
  candour-staging-redis:
  candour-staging-staticfiles:
  candour-staging-media:
